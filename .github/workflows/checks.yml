name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  indexes-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Indexes are up to date and every file has valid front matter
        run: python3 scripts/index.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests
